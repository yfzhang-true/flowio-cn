<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FlowIO P0 数字孪生</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
--ok:#3fb950;--off:#4a4a4a;--warn:#d29922;--hot:#f85149;--accent:#58a6ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;padding:18px}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin-right:6px}
.grid{display:grid;grid-template-columns:340px 1fr 300px;gap:14px;max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
button{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:8px;
padding:8px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.on{background:#1a3a1f;border-color:var(--ok);color:var(--ok)}
.pumpbtn{width:100%;padding:12px;font-size:15px}
.pumpbtn.on{background:#1a3a1f}
.valves{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vrow{display:flex;align-items:center;gap:10px}
.vlamp{width:14px;height:14px;border-radius:50%;background:var(--off);border:1px solid var(--line)}
.vlamp.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.vname{width:110px;font-size:13px}
.vbar{flex:1;height:8px;background:var(--off);border-radius:4px;overflow:hidden}
.vbar>div{height:100%;background:var(--accent)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button{padding:10px}
.gauge{display:flex;flex-direction:column;align-items:center;margin:8px 0}
.gauge text{fill:var(--fg)}
.gauge .unit{fill:var(--dim);font-size:11px}
.gauge .val{font-size:26px;font-weight:600}
.target{color:var(--warn);font-size:12px}
.clrow{margin:8px 0;font-size:13px}
.clbadge{padding:2px 10px;border-radius:12px;font-size:12px;background:#21262d}
.console{background:#0a0e14;border:1px solid var(--line);border-radius:8px;height:180px;
overflow-y:auto;padding:8px;font-family:Consolas,monospace;font-size:12px;color:#7ee787}
.cmdrow{display:flex;gap:6px;margin-top:8px}
.cmdrow input{flex:1;background:#0a0e14;border:1px solid var(--line);border-radius:6px;
color:var(--fg);padding:8px;font-family:Consolas,monospace}
.simrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.simrow input{width:70px;background:#0a0e14;border:1px solid var(--line);color:var(--fg);
border-radius:6px;padding:6px}
.help{color:var(--dim);font-size:11px;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<h1>FlowIO P0 · 数字孪生 <span class="badge" id="st">state=0x0000</span><span class="badge" id="cl">IDLE</span></h1>
<div class="sub">逻辑层与目标机固件同构（pn_core）· 物理仿真 · 全部本地运行</div>

<div class="grid">
  <!-- 气路示意 -->
  <div class="card">
    <h3>气路拓扑</h3>
    <svg viewBox="0 0 320 330" width="100%">
      <rect x="20" y="20" width="80" height="46" rx="6" id="pumpBox" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
      <text x="60" y="47" text-anchor="middle" font-size="13">370 泵</text>
      <line id="p1" x1="100" y1="34" x2="150" y2="34" stroke="#4a4a4a" stroke-width="5"/>
      <rect x="150" y="16" width="70" height="36" rx="4" id="vin" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
      <text x="185" y="39" text-anchor="middle" font-size="12">充气阀</text>
      <line id="p2" x1="100" y1="52" x2="140" y2="52" x2="0" stroke="#4a4a4a" stroke-width="5"/>
      <path d="M 100 52 H 130 V 300" stroke="#4a4a4a" stroke-width="5" fill="none"/>
      <rect x="95" y="284" width="70" height="36" rx="4" id="vvent" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
      <text x="130" y="307" text-anchor="middle" font-size="12">排气阀</text>
      <line x1="165" y1="302" x2="195" y2="302" stroke="#4a4a4a" stroke-width="5"/>
      <text x="240" y="306" font-size="11" fill="#8b949e">→ 大气</text>
      <line x1="150" y1="34" x2="150" y2="130" stroke="#4a4a4a" stroke-width="5"/>
      <line x1="130" y1="130" x2="290" y2="130" stroke="#58a6ff" stroke-width="5" id="mani"/>
      <text x="210" y="122" text-anchor="middle" font-size="12" fill="#58a6ff">汇流管</text>
      <g font-size="12" text-anchor="middle">
        <line x1="160" y1="130" x2="160" y2="170" stroke="#4a4a4a" stroke-width="4"/>
        <rect x="132" y="170" width="56" height="26" rx="4" id="pv1" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
        <text x="160" y="187">阀1</text>
        <circle cx="160" cy="222" r="16" id="bal1" fill="#161b22" stroke="#4a4a4a"/>
        <line x1="220" y1="130" x2="220" y2="170" stroke="#4a4a4a" stroke-width="4"/>
        <rect x="192" y="170" width="56" height="26" rx="4" id="pv2" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
        <text x="220" y="187">阀2</text>
        <circle cx="220" cy="222" r="16" id="bal2" fill="#161b22" stroke="#4a4a4a"/>
        <line x1="280" y1="130" x2="280" y2="170" stroke="#4a4a4a" stroke-width="4"/>
        <rect x="252" y="170" width="56" height="26" rx="4" id="pv3" fill="#161b22" stroke="#4a4a4a" stroke-width="2"/>
        <text x="280" y="187">阀3</text>
        <circle cx="280" cy="222" r="16" id="bal3" fill="#161b22" stroke="#4a4a4a"/>
      </g>
      <rect x="20" y="250" width="120" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="80" y="270" text-anchor="middle" font-size="12" fill="#8b949e">XGZP 传感器</text>
      <line x1="140" y1="265" x2="185" y2="240" stroke="#30363d" stroke-width="2" stroke-dasharray="4"/>
    </svg>
    <div class="clrow">闭环: <span class="clbadge" id="cl2">IDLE</span></div>
  </div>

  <!-- 压力表 + 控制 -->
  <div class="card">
    <h3>压力与控制</h3>
    <div style="display:flex;gap:12px">
      <div class="gauge">
        <svg width="150" height="95" viewBox="0 0 150 95">
          <path d="M 15 90 A 60 60 0 0 1 135 90" fill="none" stroke="#30363d" stroke-width="12" stroke-linecap="round"/>
          <path id="g0arc" d="M 15 90 A 60 60 0 0 1 135 90" fill="none" stroke="#58a6ff" stroke-width="12" stroke-linecap="round"/>
          <text x="75" y="55" text-anchor="middle" class="val" id="g0v">0.0</text>
          <text x="75" y="75" text-anchor="middle" class="unit">kPa · 传感器0</text>
        </svg>
      </div>
      <div class="gauge">
        <svg width="150" height="95" viewBox="0 0 150 95">
          <path d="M 15 90 A 60 60 0 0 1 135 90" fill="none" stroke="#30363d" stroke-width="12" stroke-linecap="round"/>
          <path id="g1arc" d="M 15 90 A 60 60 0 0 1 135 90" fill="none" stroke="#d29922" stroke-width="12" stroke-linecap="round"/>
          <text x="75" y="55" text-anchor="middle" class="val" id="g1v">0.0</text>
          <text x="75" y="75" text-anchor="middle" class="unit">kPa · 传感器1</text>
        </svg>
      </div>
    </div>
    <div class="vrow" style="margin:6px 0">
      <span class="vname">泵 <small>(PWM)</small></span>
      <div class="vbar"><div id="pb" style="width:0%"></div></div>
      <button id="bp" onclick="send(document.getElementById('pcmd').value)">泵</button>
    </div>
    <div class="help">闭环目标: <b id="tg">—</b> kPa ｜ 超压保护: 120 kPa（硬规则）</div>
    <h3 style="margin-top:14px">动作</h3>
    <div class="acts">
      <button onclick="send('I '+ports()+' 255')">充气</button>
      <button onclick="send('V '+ports()+' 255')">抽气</button>
      <button onclick="send('R '+ports())">释放</button>
      <button onclick="send('S '+ports())">停止/保压</button>
      <button onclick="send('G '+ports()+' '+val('gt')+' 0')" style="grid-column:1/3">▶ 压力闭环充至目标</button>
    </div>
    <div class="simrow">
      目标 <input id="gt" type="number" value="40"> kPa ｜
      端口 <input id="pm" value="1" size="3"> (5bit 掩码)
      <button onclick="send('F')" style="margin-left:auto">自检</button>
    </div>
  </div>

  <!-- 控制台 + 仿真 -->
  <div class="card">
    <h3>控制台</h3>
    <div class="console" id="log"></div>
    <div class="cmdrow">
      <input id="cmd" placeholder="命令如: I 1 255 / G 1 40 0 / T / L" onkeydown="if(event.key==='Enter')sendCmd()">
      <button onclick="sendCmd()">发送</button>
    </div>
    <h3 style="margin-top:14px">仿真注入</h3>
    <div class="simrow">
      传感器 <select id="si"><option>0</option><option>1</option></select>
      = <input id="sv" type="number" value="50" style="width:60px"> kPa
      <button onclick="sim()">注入</button>
    </div>
    <div class="simrow">
      时钟 <input id="wm" type="number" value="1000" style="width:70px"> ms
      <button onclick="adv()">推进</button>
    </div>
    <div class="help">仿真注入 = 手动改"物理世界"：可模拟泄漏(设低值)、堵口(设高值不降)等场景。</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let log = [];
function addLog(s){ const t=new Date().toLocaleTimeString(); log.unshift(`[${t}] ${s}`); log=log.slice(0,60);
  $('log').innerHTML = log.map(l=>`<div>${l}</div>`).join(''); }

function ports(){ return (parseInt($('pm').value)||1) & 31; }
function val(id){ return parseFloat($(id).value)||0; }

async function send(line){
  addLog('▶ ' + line);
  await fetch('/api/cmd', {method:'POST', body:line});
  refresh();
}
function sendCmd(){ const v=$('cmd').value.trim(); if(v){ send(v); $('cmd').value=''; } }
function sim(){ fetch('/api/sim',{method:'POST', body:`${$('si').value} ${$('sv').value}`})
  .then(()=>addLog(`◆ 仿真: 传感器${$('si').value} = ${$('sv').value} kPa`)); }
function adv(){ fetch('/api/cmd',{method:'POST', body:`W ${val('wm')||1000}`}); }

let prevCL = '';
async function refresh(){
  try{
    const s = await (await fetch('/api/state')).json();
    $('st').textContent = 'state=0x' + s.state.toString(16).padStart(4,'0').toUpperCase();
    const cl = $('cl'); cl.textContent = s.cl; $('cl2').textContent = s.cl;
    cl.style.color = {'DONE':'var(--ok)','RUNNING':'var(--accent)','TIMEOUT':'var(--hot)','ERR':'var(--hot)'}[s.cl] || 'var(--dim)';
    const bits = i => (s.state >> i) & 1;
    // 泵 + 方向阀
    $('pumpBox').setAttribute('stroke', bits(7)?'var(--ok)':'#4a4a4a');
    $('vin').setAttribute('stroke', bits(5)?'var(--ok)':'#4a4a4a');
    $('vvent').setAttribute('stroke', bits(6)?'var(--ok)':'#4a4a4a');
    $('pb').style.width = Math.round(s.pump/255*100)+'%';
    // 端口阀 1-3（阀1-5 同理可扩展）
    [0,1,2].forEach(i=>{
      const d = s.valves[i] > 0, b = bits(i);
      $('pv'+(i+1)).setAttribute('stroke', d?'var(--ok)':'#4a4a4a');
      $('bal'+(i+1)).setAttribute('fill', d?'#1a3a1f':'#161b22');
    });
    // 气泡大小随压力
    const p0 = s.sensors[0], f = Math.min(p0/130, 1);
    [1,2,3].forEach(i=>{ if(bits(i-0)) $('bal'+i).setAttribute('r', 16+f*6); });
    // 仪表
    [['g0',p0],['g1',s.sensors[1]]].forEach(([id,p])=>{
      $(id+'v').textContent = p.toFixed(1);
      const a = Math.min(p/130,1)*180;
      const rad = (180-a)*Math.PI/180;
      $(id+'arc').setAttribute('x2', 75-60*Math.cos(rad));
      $(id+'arc').setAttribute('y2', 90-60*Math.sin(rad));
    });
    if (prevCL !== s.cl){ addLog(`闭环状态: ${prevCL} → ${s.cl}`); prevCL = s.cl; }
  }catch(e){ /* 服务未就绪 */ }
}
setInterval(refresh, 200); refresh();
addLog('数字孪生已连接');
</script>
</body>
</html>
