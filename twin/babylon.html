<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FlowIO P0 · 3D 数字孪生</title>
<style>
:root{--bg:#0b0f14;--card:#11161d;--line:#2a313a;--fg:#e6edf3;--dim:#8b949e;
--ok:#3fb950;--warn:#d29922;--hot:#f85149;--accent:#58a6ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif}
#c3d{width:100vw;height:100vh;display:block;outline:none;touch-action:none}
.hud{position:fixed;pointer-events:none}
.hud > *{pointer-events:auto}
#topbar{top:14px;left:16px;background:rgba(13,17,23,.82);border:1px solid var(--line);
border-radius:10px;padding:10px 14px;font-size:13px;backdrop-filter:blur(4px)}
#topbar .b{display:inline-block;padding:2px 10px;border-radius:12px;background:#161b22;
border:1px solid var(--line);margin-right:6px}
#pressures{top:14px;right:16px;background:rgba(13,17,23,.82);border:1px solid var(--line);
border-radius:10px;padding:10px 14px;min-width:170px;backdrop-filter:blur(4px)}
#pressures .row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
#pressures .v{color:var(--accent);font-weight:600}
#panel{left:16px;bottom:14px;width:330px;background:rgba(13,17,23,.88);border:1px solid var(--line);
border-radius:10px;padding:12px;backdrop-filter:blur(4px)}
#panel h4{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px}
#panel h4:first-child{margin-top:0}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{background:#1c2430;color:var(--fg);border:1px solid var(--line);border-radius:8px;
padding:8px;cursor:pointer;font-size:12px;transition:.15s}
button:hover{border-color:var(--accent)} button:active{transform:scale(.97)}
button.wide{grid-column:1/5;background:#14283c}
input,select{background:#0d1218;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--dim)}
.row input{width:64px}
#console{right:16px;bottom:14px;width:340px;background:rgba(10,14,20,.9);border:1px solid var(--line);
border-radius:10px;padding:10px;backdrop-filter:blur(4px)}
#log{height:120px;overflow-y:auto;font-family:Consolas,monospace;font-size:11.5px;color:#7ee787}
#log div{margin:1px 0}
.cmdrow{display:flex;gap:6px;margin-top:8px}
.cmdrow input{flex:1;font-family:Consolas,monospace}
a{color:var(--accent);text-decoration:none}
.warn{color:var(--hot)}
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div class="hud" id="topbar">
  <span class="b">state=<b id="st">0x0000</b></span>
  <span class="b" id="er">无错误</span>
  <span class="b">闭环 <b id="cl">IDLE</b></span>
  <a href="/" style="margin-left:10px">← 2D 控制台</a>
</div>

<div class="hud" id="pressures">
  <div class="row"><span>S0 汇流</span><span class="v" id="p0">0.00 kPa</span></div>
  <div class="row"><span>S1 端口</span><span class="v" id="p1">0.00 kPa</span></div>
  <div class="row"><span>泵 PWM</span><span class="v" id="pwm">0</span></div>
  <div class="row"><span>时钟</span><span class="v" id="clk">0 ms</span></div>
</div>

<div class="hud" id="panel">
  <h4>动作（端口掩码 <input id="pm" value="7" size="3">）</h4>
  <div class="acts">
    <button onclick="send('I '+ports()+' 255')">充气</button>
    <button onclick="send('V '+ports()+' 255')">抽气</button>
    <button onclick="send('R '+ports())">释放</button>
    <button onclick="send('S '+ports())">保压</button>
    <button class="wide" onclick="clStart()">◎ 闭环充至目标</button>
  </div>
  <div class="row">目标 <input id="gt" type="number" value="40"> kPa
    传感 <select id="gs"><option>0</option><option>1</option></select>
    <button onclick="send('X')" style="margin-left:auto">复位</button>
  </div>
  <h4>自检与维护</h4>
  <div class="acts">
    <button onclick="send('F')">硬件自检</button>
    <button onclick="send('P')">读压力</button>
    <button onclick="send('T')">状态字</button>
    <button onclick="send('L')">阀节能</button>
  </div>
  <h4>物理注入（仿真）</h4>
  <div class="row">传感器 <select id="si"><option>0</option><option>1</option></select>
    = <input id="sv" type="number" value="50"> kPa
    <button onclick="sim()">注入</button></div>
  <div class="row">时钟 <input id="wm" type="number" value="1000"> ms
    <button onclick="adv()">推进</button></div>
</div>

<div class="hud" id="console">
  <div style="font-size:12px;color:var(--dim);margin-bottom:6px">控制台</div>
  <div id="log"></div>
  <div class="cmdrow">
    <input id="cmd" placeholder="命令..." onkeydown="if(event.key==='Enter')sendCmd()">
    <button onclick="sendCmd()">发送</button>
  </div>
</div>

<script src="/lib/babylon.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let log = [];
function addLog(s){
  const t = new Date().toLocaleTimeString();
  log.unshift(`[${t}] ${s}`); log = log.slice(0,60);
  $('log').innerHTML = log.map(l=>`<div>${l}</div>`).join('');
}

/* ═══════════ Babylon 3D 场景 ═══════════ */
const canvas = $('c3d');
const engine = new BABYLON.Engine(canvas, true, {antialias:true, stencil:true});
const scene  = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.04,0.05,0.08,1);

const camera = new BABYLON.ArcRotateCamera('cam', -1.35, 1.05, 13,
  new BABYLON.Vector3(0.5, 1.2, 0), scene);
camera.attachControl(canvas, true);
camera.lowerRadiusLimit = 4; camera.upperRadiusLimit = 30;
camera.wheelPrecision = 25; camera.panningSensibility = 600;

const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
hemi.intensity = 0.65;
const dir = new BABYLON.DirectionalLight('d', new BABYLON.Vector3(-0.5,-1,0.4), scene);
dir.intensity = 0.9; dir.position = new BABYLON.Vector3(6,12,-4);

const ground = BABYLON.MeshBuilder.CreateGround('g', {width:34, height:22}, scene);
const gmat = new BABYLON.StandardMaterial('gm', scene);
gmat.diffuseColor = new BABYLON.Color3(0.06,0.08,0.11);
gmat.specularColor = BABYLON.Color3.Black();
ground.material = gmat;

const mat = (r,g,b,em=0) => { const m = new BABYLON.StandardMaterial('m'+Math.random(), scene);
  m.diffuseColor = new BABYLON.Color3(r,g,b); m.specularColor = new BABYLON.Color3(.1,.1,.1);
  m.emissiveColor = new BABYLON.Color3(em*r,em*g,em*b); return m; };
const mBody = mat(0.55,0.58,0.62), mDark = mat(0.12,0.13,0.15),
      mOk   = mat(0.1,0.35,0.15, .25), mAir = mat(0.2,0.5,0.8, .4),
      mWarn = mat(0.5,0.35,0.05, .2);
const mBalFull = mat(0.35,0.5,0.75, .15), mBalEmpty = mat(0.2,0.25,0.3, .05);
const mOkGlow  = mat(0.1,0.35,0.15, .5);

/* 泵机组（带旋转叶轮） */
const pump = BABYLON.MeshBuilder.CreateBox('pump', {width:2.4, height:1.5, depth:1.6}, scene);
pump.position.set(-4.2, 0.75, 0); pump.material = mBody;
const pumpTop = BABYLON.MeshBuilder.CreateBox('pt', {width:1.2, height:0.25, depth:1.2}, scene);
pumpTop.position.set(-4.2, 1.62, 0); pumpTop.material = mDark;
const fan = new BABYLON.TransformNode('fan', scene);
fan.position.set(-4.2, 1.75, 0);
const blades = [];
for (let i = 0; i < 3; ++i) {
  const b = BABYLON.MeshBuilder.CreateBox('bl'+i, {width:0.95, height:0.05, depth:0.22}, scene);
  b.material = mAir; b.parent = fan; b.rotation.y = i * Math.PI / 3;
  blades.push(b);
}
const fanHub = BABYLON.MeshBuilder.CreateCylinder('fh', {diameter:0.22, height:0.1}, scene);
fanHub.parent = fan;

/* 充气阀 / 排气阀（kit 三通阀抽象体） */
const vIn = BABYLON.MeshBuilder.CreateBox('vin', {width:0.9, height:0.6, depth:0.7}, scene);
vIn.position.set(-1.6, 2.0, 0); vIn.material = mDark;
const vInLamp = BABYLON.MeshBuilder.CreateSphere('vl0', {diameter:0.16}, scene);
vInLamp.position.set(-1.28, 2.0, 0.28); vInLamp.material = mDark;
const vVe = vIn.clone('vve'); vVe.position.set(-1.6, 0.7, 0);
const vVeLamp = vInLamp.clone('vl1'); vVeLamp.position.set(-1.28, 0.7, 0.28);

/* 汇流管 */
const mani = BABYLON.MeshBuilder.CreateCylinder('mani',
  {height:7.6, diameter:0.42, tessellation:24}, scene);
mani.rotation.z = Math.PI/2; mani.position.set(2.0, 2.35, 0);
mani.material = mat(0.3,0.42,0.6);

/* 传感器 */
const sensor = BABYLON.MeshBuilder.CreateBox('sns', {width:0.45, height:0.55, depth:0.4}, scene);
sensor.position.set(1.2, 1.75, 0.62); sensor.material = mWarn;

/* 端口阀 + 气球 ×5 */
const balloons = [], pvalves = [], ptubes = [];
for (let i = 0; i < 5; ++i) {
  const x = -0.4 + i * 1.55;
  const v = BABYLON.MeshBuilder.CreateBox('pv'+i, {width:0.62, height:0.5, depth:0.55}, scene);
  v.position.set(x, 1.95, 0); v.material = i < 3 ? mOkGlow : mDark;
  const b = BABYLON.MeshBuilder.CreateSphere('bal'+i, {diameter:1.5, segments:20}, scene);
  b.position.set(x, 0.95, 0); b.material = mBalEmpty;
  b.scaling.setAll(0.4);
  const tube = BABYLON.MeshBuilder.CreateCylinder('pt'+i,
    {height:1.15, diameter:0.16, tessellation:10}, scene);
  tube.position.set(x, 1.45, 0); tube.material = mDark;
  balloons.push(b); pvalves.push(v); ptubes.push(tube);
}

/* 气球视觉状态（客户端估计）：bp[i] = 各端口压力 */
var bp = [0,0,0,0,0];
var bits = function(i){ return 0; };
var lastP0 = 0;
var simS = { pump:false };
var prevCL = null;
function makePath(p){ const pts = p.map(a => new BABYLON.Vector3(...a)); return pts; }
const pathInflate  = makePath([[-3.4,1.2,0],[-2.6,1.9,0],[-1.6,2.0,0],[0,2.35,0],[3,2.35,0]]);
const pathVent     = makePath([[3,2.35,0],[-1.6,0.7,0],[-3.6,0.4,0],[-5.8,0.4,0]]);
const puffs = [];
for (let i = 0; i < 14; ++i) {
  const s = BABYLON.MeshBuilder.CreateSphere('pf'+i, {diameter:0.16, segments:6}, scene);
  s.material = mAir; s.isVisible = false;
  puffs.push({m:s, t: Math.random(), path: null, speed: 0.5+Math.random()*0.4});
}
function lerpPath(pts, t){
  const seg = (pts.length-1) * t;
  const i = Math.min(Math.floor(seg), pts.length-2), f = seg - i;
  return BABYLON.Vector3.Lerp(pts[i], pts[i+1], f);
}

/* ═══ 状态驱动 ═══（bp/prevCL 已在上方声明） */

async function apiState(){ try { return await (await fetch('/api/state')).json(); } catch(e){ return null; } }
async function send(line){
  addLog('▶ ' + line);
  await fetch('/api/cmd', {method:'POST', body:line});
}

function ports(){ const v = parseInt($('pm').value)||1; return v & 31; }
function sim(){
  fetch('/api/sim', {method:'POST', body:`${$('si').value} ${$('sv').value}`})
    .then(()=>addLog(`◆ 注入 S${$('si').value} = ${$('sv').value} kPa`));
}
function adv(){ fetch('/api/cmd', {method:'POST', body:`W ${$('wm').value||1000}`}); }
function clStart(){ send(`G ${ports()} ${$('gt').value||40} ${$('gs').value}`); }

$('gt').addEventListener('input', () => $('tgt2') && ($('tgt2').textContent = $('gt').value||40));

let simT = 0;
engine.runRenderLoop(() => {
  const dt = engine.getDeltaTime()/1000;
  simT += dt;
  if (simS.pump) fan.rotation.y += dt * 9;
  /* 气球视觉物理 */
  for (let i = 0; i < 5; ++i) {
    const open = bits ? bits(i) : 0;
    if (open) bp[i] += (lastP0 - bp[i]) * Math.min(dt*3, 1);
    else if (bp[i] > 0) bp[i] = Math.max(0, bp[i] - dt*1.2);
    const s = 0.38 + Math.min(bp[i]/130, 1) * 1.5;
    balloons[i].scaling.setAll(s);
    balloons[i].material = bp[i] > 3 ? mBal : mat(0.2,0.25,0.3,.05);
  }
  /* 气流粒子 */
  for (const pf of puffs) {
    if (!pf.path || !pf.on) { pf.m.isVisible = false; continue; }
    pf.t += dt * pf.speed;
    if (pf.t > 1) pf.t -= 1;
    pf.m.position.copyFrom(lerpPath(pf.path, pf.t));
    pf.m.isVisible = true;
  }
  scene.render();
});

/* ── 轮询 API → 驱动场景 ── */
let lastS = null;
setInterval(async () => {
  const s = await apiState(); if (!s) return;
  lastS = s;
  $('st').textContent = 'state=0x' + s.state.toString(16).padStart(4,'0').toUpperCase();
  $('er').textContent = s.err ? '⚠ 错误' : '无错误';
  $('er').style.color = s.err ? 'var(--hot)' : 'var(--dim)';
  $('cl').textContent = s.cl;
  $('p0').textContent = s.sensors[0].toFixed(2) + ' kPa';
  $('p1').textContent = s.sensors[1].toFixed(2) + ' kPa';
  $('pwm').textContent = s.pump;
  $('clk').textContent = '—';
  bits = i => (s.state >> i) & 1;
  lastP0 = s.sensors[0];
  simS.pump = !!bits(7);
  /* 泵叶轮动画由渲染循环根据 simS.pump 处理 */
  vIn.material = bits(5) ? mOk : mDark;
  vVe.material = bits(6) ? mOk : mDark;
  vInLamp.material = bits(5) ? mAir : mDark;
  vVeLamp.material = bits(6) ? mAir : mDark;
  /* 端口阀颜色 */
  for (let i = 0; i < 5; ++i) pvalves[i].material = bits(i) ? mOk : mDark;
  /* 气流粒子路径分配 */
  const inflow = bits(7) && bits(5);
  const vacflow = bits(7) && bits(6) && !bits(5);
  const ventflow = bits(6) && !bits(7);
  puffs.forEach((pf, i) => {
    if (inflow) { pf.path = pathInflate; pf.on = (i % 2 === 0); }
    else if (vacflow) { pf.path = pathVent; pf.on = true; pf.dir = true; }
    else { pf.on = false; pf.m && (pf.m.isVisible = false); }
  });
  if (prevCL !== s.cl){ addLog(`闭环: ${prevCL ?? '—'} → ${s.cl}`); prevCL = s.cl; }
}, 180);

/* 气球视觉物理需要 lastP0/simS/bits 全局 */
var bits = i => 0; var lastP0 = 0; var simS = {pump:false};
/* 上面 interval 内重新以 var 声明提升作用域——实际初始化在此 */
</script>
</body>
</html>
