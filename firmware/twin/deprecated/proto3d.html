<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FlowIO-CN P0 · 控制台</title>
<script src="/lib/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0d1117;color:#e6edf3;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:13px}
a{color:#58a6ff;text-decoration:none}
.topbar{background:#161b22;padding:10px 18px;display:flex;align-items:center;gap:14px;
border-bottom:1px solid #30363d;position:sticky;top:0;z-index:10}
.topbar .brand{font-weight:700;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#3fb950}
.dot.err{background:#f85149}
.badge{padding:2px 10px;border-radius:12px;background:#21262d;border:1px solid #30363d;font-size:12px}

.layout{display:grid;grid-template-columns:250px 1fr 300px;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px}
.card h3{font-size:14px;margin-bottom:8px;color:#58a6ff}

/* ═══ 动画气路 SVG ═══ */
.schem3d{background:#0d1218;border-radius:10px;padding:10px;overflow:hidden;position:relative;min-height:420px}
.schem3d svg{width:100%;height:auto}
.pumpbody{fill:#161b22;stroke:#4a4a4a;stroke-width:2;transition:stroke .3s}
.pumpbody.on{stroke:#3fb950}
.impeller-g{fill:none;stroke:#8b949e;stroke-width:3;transition:stroke .3s,transform .1s}
.impeller-g.on{stroke:#7ee0ff;animation:spin .5s linear infinite;transform-box:view-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.vbox{fill:#161b22;stroke:#4a4a4a;stroke-width:2;transition:stroke .3s}
.vbox.open{stroke:#3fb950}
.vlamp{transition:fill .3s}
.flowline{stroke-dasharray:8 8;opacity:0}
.flowline.active{opacity:1;animation:dashflow .6s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-32}}
.balloon-c{transition:r .5s ease, fill .3s}

/* ECharts */
#chart{width:100%;height:220px}

/* 端口卡片 */
.pcard{border:1px solid #30363d;border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pcard.sel{border-color:#58a6ff;box-shadow:0 0 8px rgba(88,166,255,.3)}
.pcard .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.pcard .pv{font-size:16px;font-weight:600;color:#58a6ff}
.pcard .pv small{font-size:10px;color:#8b949e;font-weight:400}
.pbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pbtns button{padding:4px 0;font-size:11px;border-radius:5px}

/* 底部控制 */
.bottombar{position:sticky;bottom:0;background:#161b22;border-top:1px solid #30363d;
padding:10px 18px;display:flex;align-items:center;gap:12px;z-index:5}
.bottombar button{background:#1c2430;color:#e6edf3;border:1px solid #30363d;border-radius:6px;
padding:8px 16px;cursor:pointer;font-size:13px}
.bottombar button:hover{border-color:#58a6ff}
.bottombar .st-b{display:inline-block;padding:2px 10px;border-radius:10px;background:#161b22;
border:1px solid #30363d;font-size:12px}
.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#3fb950}
.statusdot.err{background:#f85149}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">FlowIO-CN P0</span>
  <span class="dot" id="sysdot"></span>
  <span class="badge" id="tbcl">IDLE</span>
  <span class="badge" id="tberr">无错误</span>
  <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <span class="statusdot" id="sysdot"></span>
    <span class="badge" style="padding:2px 8px;border-radius:8px;background:#161b22" id="tbclk2">0.0 s</span>
  </span>
</div>

<div class="layout">
  <!-- ═══ 左栏：端口控制卡片 ═══ -->
  <div>
    <div class="card">
      <h3>⚙ 端口控制</h3>
      <div id="pcards"></div>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>📋 操作</h3>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button onclick="send('F')">🔧 硬件自检</button>
        <button onclick="send('T')">📊 状态字</button>
        <button onclick="send('L')">⚡ 阀节能</button>
      </div>
    </div>
  </div>

  <!-- ═══ 中栏：动画气路图 + 动作按钮 ═══ -->
  <div>
    <div class="card schem3d" style="padding:10px">
      <svg viewBox="0 0 560 400" width="100%">
        <defs>
          <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
          <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#3fb950"/></marker>
        </defs>
        <!-- 泵壳体 -->
        <rect x="130" y="200" width="170" height="70" rx="8" fill="#0d1218" stroke="#5b6b7a" stroke-width="2"/>
        <text x="215" y="225" text-anchor="middle" font-size="12" fill="#8b949e">370 泵（充吸两用）</text>
        <!-- 泵叶轮 -->
        <g id="pumpimp" style="transform-origin:215px 260px">
          <circle cx="215" cy="260" r="20" fill="#dfe7ee" stroke="#5b6b7a" stroke-width="2"/>
          <path d="M 215 260 L 215 240 A 20 20 0 0 1 232 250 Z" fill="#9fb3c4"/>
          <path d="M 215 260 L 232 270 A 20 20 0 0 1 198 270 Z" fill="#b8c7d4"/>
        </g>
        <!-- 进气阀 → 泵吸气口 -->
        <text x="30" y="230" font-size="11" fill="#8b949e">大气</text>
        <line x1="55" y1="236" x2="85" y2="236" stroke="#909090" stroke-width="3"/>
        <rect x="85" y="226" width="24" height="20" rx="3" fill="#d7dee5" stroke="#8b98a5"/>
        <text x="97" y="240" text-anchor="middle" font-size="9" fill="#37474f">进气</text>
        <line x1="109" y1="236" x2="135" y2="236" stroke="#909090" stroke-width="3"/>
        <text x="139" y="229" font-size="10" fill="#6b7280">吸气口</text>
        <line x1="139" y1="236" x2="160" y2="236" stroke="#909090" stroke-width="3"/>
        <!-- 泵排气口 → 排气三通阀 → 汇流管 -->
        <line x1="270" y1="236" x2="310" y2="236" stroke="#909090" stroke-width="3"/>
        <text x="272" y="229" font-size="10" fill="#6b7280">排气口</text>
        <rect x="310" y="226" width="24" height="20" rx="3" fill="#d7dee5" stroke="#8b98a5"/>
        <text x="322" y="240" text-anchor="middle" font-size="9" fill="#37474f">排气</text>
        <line x1="334" y1="236" x2="365" y2="236" stroke="#909090" stroke-width="3" id="ex_line"/>
        <line x1="365" y1="236" x2="365" y2="170" stroke="#909090" stroke-width="3" id="ex_rise"/>
        <!-- 汇流管（5端口） -->
        <rect x="330" y="60" width="220" height="20" rx="5" fill="#dde9f3" stroke="#7a9bb5" stroke-width="1.5"/>
        <text x="440" y="74" text-anchor="middle" font-size="11" fill="#33475b">汇流管（5 端口）</text>
        <!-- 5 个端口阀 + 气球 -->
        <g id="portvals"></g>
        <!-- 传感器指示 -->
        <circle cx="365" cy="176" r="5" fill="#c0392b"/>
        <text x="375" y="180" font-size="9" fill="#8b949e">S0</text>
        <!-- 压力大字 -->
        <text id="bigp" x="440" y="45" text-anchor="end" font-family="Consolas" font-size="18" font-weight="bold" fill="#58a6ff">0.0</text>
        <text x="440" y="45" font-size="10" fill="#8b949e">kPa</text>
      </svg>

      <!-- PWM 滑块 -->
      <div style="display:flex;gap:14px;margin:8px 0;font-size:12px;color:#8b949e">
        <span>充气 PWM: <b id="pwmIv" style="color:#58a6ff">255</b></span>
        <input type="range" id="pwmI" min="80" max="255" value="255" style="flex:1"
          oninput="$('pwmIv').textContent=this.value">
      </div>

      <!-- 动作按钮 -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0">
        <button onclick="send('I '+ports()+' '+val('pwmI'))" style="padding:10px 0">▶ 充气</button>
        <button onclick="send('V '+ports()+' '+val('pwmV'))" style="padding:10px 0">▼ 抽气</button>
        <button onclick="send('R '+ports())" style="padding:10px 0">↗ 释放</button>
        <button onclick="send('S '+ports())" style="padding:10px 0">■ 保压</button>
        <button onclick="send('X')" style="padding:10px 0">◎ 复位</button>
      </div>
    </div>
  </div>

  <!-- ═══ 右栏：传感器 + Scheduler + Log ═══ -->
  <div>
    <div class="card">
      <h3>📊 传感器</h3>
      <div id="sensorlist"></div>
      <button onclick="send('F')" style="margin-top:8px">🔍 自检</button>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>📋 任务序列</h3>
      <div id="seqctrl"></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button onclick="seqAddRow()" style="flex:1">＋</button>
        <button onclick="seqDelRow()" style="flex:1">－</button>
      </div>
      <button onclick="seqRun()" style="width:100%;margin-top:8px;padding:8px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer">▶ 运行序列</button>
      <button onclick="seqStopSeq()" style="width:100%;margin-top:6px;padding:8px;background:#c0392b;color:#fff;border:none;border-radius:6px;cursor:pointer">■ 停止</button>
    </div>
    <div class="card" style="margin-top:10px">
      <h3>📝 日志</h3>
      <div id="devlog" style="max-height:200px;overflow-y:auto;font-family:Consolas,monospace;font-size:11px;color:#7ee787"></div>
    </div>
  </div>
</div>

<script src="/lib/echarts.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);

/* ═══ 全局状态 ═══ */
let S = { state:0, valves:[0,0,0,0,0,0,0], pump:0, sensors:[0,0], cl:'IDLE', err:0 };
let seqRunning = false, seqTimers = [];
let logCount = 0;

/* ═══ 端口卡片生成 ═══ */
const portNames = ['端口1','端口2','端口3','端口4(备用)','端口5(备用)'];
const pcardsEl = $('pcards');
for (let i = 0; i < 5; ++i) {
  const un = i >= 3;
  const div = document.createElement('div');
  div.className = 'pcard' + (un ? ' un' : '');
  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <b style="font-size:13px">${portNames[i]}</b>
      <span id="pv${i}" style="font-family:Consolas;font-size:14px;color:#58a6ff">0.0</span><span style="font-size:10px;color:#6b7280">kPa</span>
    </div>
    <div style="display:flex;gap:4px;margin-top:4px">
      <button onclick="send('I '+(1<<${i})+' 255')" style="flex:1;padding:5px 0;font-size:11px">充</button>
      <button onclick="send('R '+(1<<${i}))" style="flex:1;padding:5px 0;font-size:11px">释</button>
    </div>`;
  pcardsEl.appendChild(div);
}

/* ═══ 传感器显示 ═══ */
const sensorEl = $('sensorlist');
for (let i = 0; i < 2; ++i) {
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;justify-content:space-between;padding:4px 0;font-size:12px';
  div.innerHTML = `<span>XGZP #${i+1}</span><b id="sns${i}" style="color:#58a6ff">--</b>`;
  sensorEl.appendChild(div);
}

/* ═══ 发送命令 ═══ */
async function send(line){
  try {
    await fetch('/api/cmd', {method:'POST', body:line});
    dlog('▶ ' + line);
  } catch(e) {
    dlog('✗ ' + e.message);
  }
}

function dlog(s){
  const b = $('devlog'); if (!b) return;
  const d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + s;
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
}

/* ═══ 序列执行 ═══ */
let seqRunning = false;
let seqTimers = [];

function seqRun(){
  if (seqRunning) return;
  seqRunning = true;
  dlog('▶ 序列开始');
  for (const t of seqTimers) clearTimeout(t);
  seqTimers = [];
  const lines = $('seqtext').value.split('\n').map(l=>l.trim()).filter(l=>l && !l.startsWith('#'));
  let delay = 0;
  for (const line of lines) {
    const m = line.match(/^W\s+(\d+)$/);
    if (m) { seqTimers.push(setTimeout(dlog, delay, '⏳ ' + m[1] + 'ms')); delay += +m[1]; continue; }
    seqTimers.push(setTimeout(send, delay, line));
    delay += 500;
  }
  seqTimers.push(setTimeout(() => { seqRunning = false; dlog('■ 序列完成'); }, delay + 500));
}
function seqStopSeq(){ seqRunning = false; seqTimers.forEach(clearTimeout); dlog('■ 已停止'); }

/* ═══ 轮询（每 400ms 刷新 UI）═══ */
let seqRunning = false;
let seqTimers = [];

setInterval(async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    /* 更新传感器读数 */
    for (let i = 0; i < 2; ++i) {
      const el = $('sns' + i);
      if (el) el.textContent = s.sensors[i].toFixed(1) + ' kPa';
    }
    /* 更新闭环状态 */
    const clEl = $('tbcl');
    if (clEl) clEl.textContent = s.cl;
    /* 更新状态指示灯 */
    const dot = document.querySelector('.statusdot');
    if (dot) dot.className = 'statusdot' + (s.err ? ' err' : '');
  } catch(e) { /* 网络错误忽略 */ }
}, 400);

function dlog(s){
  const b = $('devlog'); if (!b) return;
  const d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + s;
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
}

/* ═══ 启动 ═══ */
renderSched();
dlog('✅ 页面加载完成');
dlog('💡 等待硬件连接...');
</script>
</body>
</html>
